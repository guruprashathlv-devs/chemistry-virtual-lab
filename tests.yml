name: Chemistry Lab checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app.py storage.py ai_tutor.py chemistry_core.py
      - run: python -m unittest discover -s tests -v
